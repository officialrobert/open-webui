services:
  # Application instances - each builds its own image locally
  open-webui-1:
    build:
      context: .
      args:
        USE_OLLAMA: "false"
        USE_SLIM: "false"
      dockerfile: Dockerfile
      target: final
    container_name: open-webui-1
    volumes:
      - open-webui-1:/app/backend/data
    ports:
      - "3001:8080"
    environment:
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  open-webui-2:
    build:
      context: .
      args:
        USE_OLLAMA: "false"
        USE_SLIM: "false"
      dockerfile: Dockerfile
      target: final
    container_name: open-webui-2
    volumes:
      - open-webui-2:/app/backend/data
    ports:
      - "3002:8080"
    environment:
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  open-webui-3:
    build:
      context: .
      args:
        USE_OLLAMA: "false"
        USE_SLIM: "false"
      dockerfile: Dockerfile
      target: final
    container_name: open-webui-3
    volumes:
      - open-webui-3:/app/backend/data
    ports:
      - "3003:8080"
    environment:
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui-1: {}
  open-webui-2: {}
  open-webui-3: {}
